# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ORBIT CodeRabbit policy: comprehensive, security-first, evidence-led reviews.

language: en-US

tone_instructions: >-
  Be concise, technical, and evidence-led. Prioritize correctness, security, data
  integrity, test reliability, and reproducibility. Report only actionable
  findings with concrete impact and fix guidance.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_reviewers: true
  poem: false

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - 'WIP'
      - 'DO NOT MERGE'
      - 'NO REVIEW'

  path_instructions:
    - path: '**'
      instructions: |
        ORBIT is a local-first TypeScript engineering-intelligence monorepo. Its purpose is to trace repository changes and connect them to verifiable tests, coverage, build results, telemetry and evidence through Change Passports.
        Treat evidence integrity as a core invariant: never accept fabricated, inferred or silently upgraded test/build/device results. Distinguish verified, supplied, missing, stale and unavailable evidence.
        Prioritize exploitable security defects, data loss/corruption, incorrect graph or hash-chain semantics, broken provenance, unsafe filesystem/process/network operations, auth/authorization flaws, secret leakage, injection, path traversal, SSRF, race conditions, resource exhaustion, and false-positive/false-negative verification.
        For TypeScript, check strict typing, runtime validation at trust boundaries, async error handling, deterministic behavior, backward compatibility and resource cleanup.
        For CLI/API/MCP interfaces, check input validation, read-only guarantees where promised, stable output contracts, safe defaults and actionable errors.
        For tests, check meaningful assertions, edge cases, regression coverage, isolation, determinism and cleanup. Do not treat a passing test suite as proof of untested behavior.
        For GitHub Actions and CI, check least-privilege permissions, pinned third-party actions, untrusted event data in shell commands, token exposure, artifact provenance and platform-matrix consistency.
        Avoid style-only comments when ESLint, Prettier or TypeScript already enforce the rule. Do not invent findings; cite the exact changed lines and explain a realistic failure scenario.
    
    - path: '.github/workflows/**'
      instructions: |
        Treat workflow edits as security-sensitive. Check least-privilege permissions, action pinning, pull_request_target misuse, untrusted context interpolation, secrets exposure, cache poisoning, artifact trust and fork-PR behavior.
    - path: '**/*.{ts,tsx,js,mjs,cjs}'
      instructions: |
        Review TypeScript/JavaScript for unsafe input handling, async races, unhandled rejections, resource leaks, unsafe casts, weak runtime validation and test gaps. Check Node.js 22+ compatibility and ESM behavior.
    - path: '**/*test*/**'
      instructions: |
        Review tests for meaningful behavior assertions, edge cases, deterministic execution, isolation, cleanup and regression coverage. Flag tests that can pass without exercising the intended behavior.
    - path: '**/*.{json,yaml,yml,toml}'
      instructions: |
        Check configuration correctness, unsafe defaults, secret exposure, schema compatibility and accidental environment-specific assumptions. For GitHub Actions YAML, apply the workflow security instructions too.
    - path: 'packages/witness/**'
      instructions: |
        Treat verification and evidence provenance as critical. Check exact changed-line attribution, coverage/report parsing, JUnit/Cobertura/LCOV handling, SARIF correctness, hash integrity and the distinction between missing evidence and passing evidence.
    - path: '**/*mcp*/**'
      instructions: |
        Treat MCP tools and server boundaries as security-sensitive. Check read-only guarantees, tool input validation, path restrictions, prompt-injection boundaries, least privilege, output trust and accidental side effects.
    - path: '**/*accelq*/**'
      instructions: |
        Check that external test execution is opt-in, credentials are never logged or committed, failures/timeouts are reported honestly, and no external run is marked successful without verifiable provider evidence.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
