# CodeRabbit repository configuration
# The CodeRabbit GitHub App must also be installed and this repository enabled
# in the CodeRabbit dashboard before reviews can run.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
