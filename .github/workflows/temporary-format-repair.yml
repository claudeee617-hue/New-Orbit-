name: Temporary ORBIT formatting repair

on:
  push:
    branches:
      - feat/orbit-3d-privacy-compliance

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/orbit-3d-privacy-compliance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/orbit-3d-privacy-compliance
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install formatter
        run: pnpm install --frozen-lockfile
      - name: Format changed application files
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/CommandCenter.tsx apps/web/src/Graph3D.tsx apps/web/src/PrivacyCenter.tsx apps/web/src/styles.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/CommandCenter.tsx apps/web/src/Graph3D.tsx apps/web/src/PrivacyCenter.tsx apps/web/src/styles.css
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: format 3D graph and privacy centre"
          git push origin HEAD:feat/orbit-3d-privacy-compliance
