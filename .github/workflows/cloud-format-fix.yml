name: Cloud format fix

on:
  push:
    branches:
      - feat/cloud-api-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format cloud API sources
        run: pnpm exec prettier --write apps/cloud-api/src/index.test.ts
      - name: Commit formatter output
        run: |
          git add apps/cloud-api/src/index.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(cloud): apply canonical Prettier formatting"
            git push
          fi
