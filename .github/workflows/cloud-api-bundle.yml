name: Build ORBIT Cloud API bundle

on:
  push:
    branches:
      - feat/cloud-api-foundation
    paths:
      - apps/cloud-api/**
      - packages/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Bundle without deploying
        run: pnpm dlx wrangler@4.136.0 versions upload apps/cloud-api/src/index.ts --dry-run --outdir ./cloud-api-bundle --config apps/cloud-api/wrangler.jsonc
      - name: Inspect Wrangler output
        run: |
          find cloud-api-bundle .wrangler apps/cloud-api/.wrangler -type f -printf '%p %s bytes\\n' 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-cloud-api-bundle
          path: |
            cloud-api-bundle/
            .wrangler/
            apps/cloud-api/.wrangler/
          if-no-files-found: error
