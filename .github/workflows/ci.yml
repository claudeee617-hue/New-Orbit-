name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # format:check, lint, typecheck, test, build
      - name: Check
        run: pnpm run check

  mcp-stdio:
    name: MCP stdio SQLite read-only acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm run build

      - name: Run production MCP stdio acceptance test
        run: pnpm --filter @orbit/mcp test:stdio

  browser-e2e:
    name: browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace package
        run: pnpm --filter @orbit/shared build

      # Keep browser tooling out of the production/workspace dependency graph.
      - name: Install Playwright test runner
        run: pnpm dlx --package=@playwright/test playwright --version

      - name: Install Chromium
        run: pnpm dlx --package=@playwright/test playwright install --with-deps chromium

      - name: Run resilient browser E2E
        env:
          CI: true
        run: >-
          pnpm dlx --package=@playwright/test -c
          'PLAYWRIGHT_MODULE="$(find "$(dirname "$(dirname "$(command -v playwright)")")"
          -path "*/@playwright/test" -type d -print -quit)"
          playwright test --config=e2e/playwright.config.cjs'

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
