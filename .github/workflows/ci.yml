name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  # Isolate each commit: an orphaned runner for an older PR head must not block the current head.
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --audit-level=moderate

      # format:check, lint, typecheck, test, build
      - name: Check
        run: pnpm run check

  mcp-stdio:
    name: MCP stdio SQLite read-only acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm run build

      - name: Run production MCP stdio acceptance test
        run: pnpm --filter @orbit/mcp test:stdio

  browser-e2e:
    name: browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build the local API and all workspace dependencies
        run: pnpm --filter @orbit/api... build

      - name: Build shared workspace package
        run: pnpm --filter @orbit/shared build

      - name: Prepare disposable local workspace fixture
        shell: bash
        env:
          FIXTURE_DIR: ${{ runner.temp }}/orbit-e2e-fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE_DIR/src"
          cat > "$FIXTURE_DIR/src/index.ts" <<'EOF'
          export function orbitSmoke(value: string): string {
            return `ORBIT:${value}`;
          }
          EOF
          cat > "$FIXTURE_DIR/README.md" <<'EOF'
          # Disposable ORBIT CI workspace
          This fixture is created only for an isolated CI database smoke test.
          EOF

      - name: Start the real local API with a disposable SQLite database
        shell: bash
        env:
          ORBIT_DB_PATH: ${{ runner.temp }}/orbit-e2e/orbit.db
          ORBIT_HOST: 127.0.0.1
          ORBIT_PORT: '4318'
          ORBIT_API_TOKEN: orbit_ci_test_token_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ORBIT_DB_PATH")"
          node apps/api/dist/main.js > "$RUNNER_TEMP/orbit-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orbit-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4318/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/orbit-api.log"
          echo "Disposable ORBIT API did not become healthy" >&2
          exit 1

      # Keep browser tooling out of the production/workspace dependency graph.
      - name: Install Playwright test runner
        run: pnpm dlx --package=@playwright/test playwright --version

      - name: Install Chromium
        # apt mirrors occasionally fail on hosted runners; retry before failing the job.
        run: |
          for attempt in 1 2 3; do
            if pnpm dlx --package=@playwright/test playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Chromium install attempt $attempt failed; retrying" >&2
            sleep 15
          done
          exit 1

      - name: Run resilient browser E2E
        env:
          CI: true
          ORBIT_API_URL: http://127.0.0.1:4318
          ORBIT_E2E_API_URL: http://127.0.0.1:4318
          ORBIT_E2E_API_TOKEN: orbit_ci_test_token_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ
          ORBIT_E2E_FIXTURE_ROOT: ${{ runner.temp }}/orbit-e2e-fixture
        run: >-
          pnpm dlx --package=@playwright/test -c
          'PLAYWRIGHT_MODULE="$(find "$(dirname "$(dirname "$(command -v playwright)")")"
          -path "*/@playwright/test" -type d -print -quit)"
          playwright test --config=e2e/playwright.config.cjs'

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbit-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
