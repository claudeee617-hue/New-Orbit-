name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Temporary action formatter preview
        if: matrix.os == 'ubuntu-latest' && github.event.pull_request.head.ref == 'feat/prompt-13-github-action'
        run: |
          pnpm exec prettier --write .github/actions/orbit/action.yml .github/scripts/orbit-action.mjs docs/GITHUB_ACTION.md
          echo '--- ACTION MANIFEST ---'
          cat .github/actions/orbit/action.yml
          echo '--- ACTION SCRIPT ---'
          cat .github/scripts/orbit-action.mjs
          echo '--- ACTION DOC ---'
          cat docs/GITHUB_ACTION.md

      # format:check, lint, typecheck, test, build
      - name: Check
        run: pnpm run check
