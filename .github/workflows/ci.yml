name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format and inspect Prompt 11 sources (temporary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm exec prettier --write apps/api/src/server.test.ts apps/api/src/server.ts apps/api/src/session-token.ts apps/cli/src/operations.test.ts apps/cli/src/operations.ts
          for file in apps/api/src/server.test.ts apps/api/src/server.ts apps/api/src/session-token.ts apps/cli/src/operations.test.ts apps/cli/src/operations.ts; do
            echo "===PROMPT11_FILE_BEGIN:$file==="
            cat "$file"
            echo "===PROMPT11_FILE_END:$file==="
          done

      # format:check, lint, typecheck, test, build
      - name: Check
        run: pnpm run check
