name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Temporary API test formatter preview
        if: matrix.os == 'ubuntu-latest' && github.event.pull_request.head.ref == 'feat/prompt-12-command-center-final'
        run: |
          pnpm exec prettier --write apps/web/src/api.test.ts
          echo '--- API TESTS ---'
          cat apps/web/src/api.test.ts

      # format:check, lint, typecheck, test, build
      - name: Check
        run: pnpm run check
