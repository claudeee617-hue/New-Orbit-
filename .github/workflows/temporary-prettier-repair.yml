name: Temporary Prettier repair

on:
  push:
    branches:
      - feat/prompts-6-8-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format changed Prompt 6-8 files
        run: |
          pnpm exec prettier --write \
            apps/cli/src/advanced-engines.test.ts \
            apps/cli/src/advanced-engines.ts \
            apps/cli/src/engines.ts \
            packages/atlas/src/capsule-extended.ts \
            packages/atlas/src/engines-extended.test.ts \
            packages/atlas/src/flare-extended.ts \
            packages/atlas/src/index.ts \
            packages/atlas/src/witness-extended.ts
      - name: Commit formatting only when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/cli/src/advanced-engines.test.ts apps/cli/src/advanced-engines.ts apps/cli/src/engines.ts packages/atlas/src/capsule-extended.ts packages/atlas/src/engines-extended.test.ts packages/atlas/src/flare-extended.ts packages/atlas/src/index.ts packages/atlas/src/witness-extended.ts
            git commit -m "style: format Prompt 6-8 implementation"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Formatting already clean."
          fi
