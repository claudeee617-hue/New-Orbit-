name: Temporary Prettier repair

on:
  push:
    branches:
      - feat/prompts-6-8-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format audited source files
        run: |
          pnpm exec prettier --write \
            packages/atlas/src/passport-engine.ts \
            packages/atlas/src/passport.ts \
            packages/atlas/src/telemetry-store.ts
      - name: Commit formatting only when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/atlas/src/passport-engine.ts packages/atlas/src/passport.ts packages/atlas/src/telemetry-store.ts
            git commit -m "style: format audited Prompt 9-10 sources"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Formatting already clean."
          fi
