name: Format cloud workspace UI

on:
  push:
    branches: [feat/cloud-workspace-pages-bridge]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloud-workspace-pages-bridge
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/CloudWorkspace.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/CloudWorkspace.tsx
          git commit -m "style: format cloud workspace authentication UI"
          git push origin HEAD:feat/cloud-workspace-pages-bridge
