name: Format dashboard branch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'e2e/command-center.spec.cjs'

permissions:
  contents: write

concurrency:
  group: format-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Format changed dashboard files
        run: pnpm exec prettier --write apps/web/src/App.tsx e2e/command-center.spec.cjs

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/src/App.tsx e2e/command-center.spec.cjs; then
            echo "Dashboard files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx e2e/command-center.spec.cjs
          git commit -m "style: format ORBIT dashboard and browser test"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
