name: Format Prompt 12 workbench
on:
  push:
    branches:
      - fix/prompt12-prettier-format
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt12-prettier-format
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the failing file and remove this temporary workflow
        run: |
          pnpm exec prettier --write apps/web/src/EngineWorkbenches.tsx
          rm .github/workflows/format-prompt12-workbench.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EngineWorkbenches.tsx .github/workflows/format-prompt12-workbench.yml
          git commit -m "style(web): format prompt 12 workbenches"
          git push
