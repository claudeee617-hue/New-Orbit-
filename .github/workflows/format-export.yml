name: Temporary ORBIT formatting helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-dashboard:
    if: github.event.pull_request.head.ref == 'feat/world-class-command-center' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format dashboard files
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/styles.css
      - name: Commit formatting on the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- apps/web/src/App.tsx apps/web/src/styles.css)" ]; then
            git add apps/web/src/App.tsx apps/web/src/styles.css
            git commit -m "style(web): apply Prettier formatting"
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
          else
            echo "Dashboard files are already formatted."
          fi
