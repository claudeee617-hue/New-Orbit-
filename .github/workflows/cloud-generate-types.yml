name: Generate Cloudflare Worker types

on:
  push:
    branches:
      - feat/cloud-api-foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Worker binding types
        run: |
          cd apps/cloud-api
          pnpm dlx wrangler@4.136.0 types worker-configuration.d.ts --config wrangler.jsonc --env-interface Env
      - name: Commit generated types
        run: |
          git add apps/cloud-api/worker-configuration.d.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(cloud): generate Worker binding types"
            git push
          fi
