name: Cloud format preview

on:
  push:
    branches:
      - feat/cloud-api-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier output
        run: |
          pnpm exec prettier apps/cloud-api/src/index.ts
          pnpm exec prettier apps/cloud-api/wrangler.jsonc
