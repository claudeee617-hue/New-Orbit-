name: Format cloud workspace integration

on:
  push:
    branches: [feat/cloud-workspace-pages-bridge]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloud-workspace-pages-bridge

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install formatter
        run: pnpm install --frozen-lockfile

      - name: Format changed integration files
        run: >-
          pnpm exec prettier --write
          apps/cloud-api/src/index.ts
          apps/web/src/App.tsx
          apps/web/src/CloudWorkspace.tsx
          functions/api/cloud/v1/workspaces.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud-api/src/index.ts apps/web/src/App.tsx apps/web/src/CloudWorkspace.tsx functions/api/cloud/v1/workspaces.test.ts
          git commit -m "style: format cloud workspace integration"
          git push origin HEAD:feat/cloud-workspace-pages-bridge
