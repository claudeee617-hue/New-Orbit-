name: Bug report
description: Report a reproducible problem in ORBIT.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Do not include credentials, private source code, personal data or exploitable vulnerability details. Use SECURITY.md for security reports.'
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal steps using a safe fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ORBIT version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitised logs
      description: Remove tokens, paths and sensitive values before posting.
    validations:
      required: false
